name: Update forecast snapshot

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/snapshot.py', 'tests/**', '.github/workflows/runinfo.yml']

permissions:
  contents: write

concurrency:
  group: runinfo
  cancel-in-progress: false

jobs:
  runinfo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr
          python -m pip install 'Pillow==11.3.0'
      - name: Check timeline and snapshot validation
        run: |
          python -m unittest discover -s tests -v
          node tests/timeline.cjs
          node tests/scheduler.mjs
      - name: Capture and validate the printed forecast times
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/run.json" -o /tmp/previous.json || printf '{}' > /tmp/previous.json
          python scripts/snapshot.py /tmp/forecast --previous /tmp/previous.json
      - name: Publish immutable images and their timeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ ! -f /tmp/forecast/run.json ]; then exit 0; fi
          cd /tmp/forecast
          git init -q -b data
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add plots
          git commit -qm 'Verified forecast images'
          # Commit-pinned URLs prevent an open page from mixing forecast runs.
          export SNAPSHOT_SHA=$(git rev-parse HEAD)
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('run.json')
          data = json.loads(path.read_text())
          data['imageBase'] = f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/{os.environ['SNAPSHOT_SHA']}/plots/"
          path.write_text(json.dumps(data) + '\n')
          PY
          git add run.json
          git commit -qm 'Verified forecast timeline'
          # Keep only this snapshot's two commits on the data branch.
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data:data
