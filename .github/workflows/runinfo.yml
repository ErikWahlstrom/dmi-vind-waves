name: Update forecast snapshot

on:
  schedule:
    - cron: '7,27,47 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', '.github/workflows/runinfo.yml']

permissions:
  contents: write
  actions: read

concurrency:
  group: runinfo
  cancel-in-progress: false

jobs:
  runinfo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/cartopy
          key: cartopy-natural-earth-10m-v1
      - name: Install forecast rendering dependencies
        run: |
          python -m pip install -r scripts/requirements.txt
      - name: Check timeline and snapshot validation
        run: |
          python -m unittest discover -s tests -v
          node tests/timeline.cjs
          node tests/scheduler.mjs
      - name: Render a complete forecast from DMI or DWD data
        id: capture
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/data/run.json" -o /tmp/previous.json || printf '{}' > /tmp/previous.json
          python -X faulthandler scripts/forecast.py /tmp/forecast --previous /tmp/previous.json
      # These completed steps retain incident state across scheduled runs,
      # including the first run that fails deliberately to send one email.
      - name: Record DMI source outage
        if: steps.capture.outputs.source_unavailable == 'true'
        run: echo 'Source outage; saved forecast retained.'
      - name: Record DMI source reachable
        if: steps.capture.outputs.source_unavailable != 'true'
        run: echo 'Source verified; next outage may send a new alert.'
      - name: Notify once per DMI outage
        if: steps.capture.outputs.source_unavailable == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/outage_alert.py
      - name: Publish immutable images and their timeline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if [ ! -f /tmp/forecast/run.json ]; then exit 0; fi
          cd /tmp/forecast
          git init -q -b data
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add plots
          git commit -qm 'Verified forecast images'
          # Commit-pinned URLs prevent an open page from mixing forecast runs.
          export SNAPSHOT_SHA=$(git rev-parse HEAD)
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('run.json')
          data = json.loads(path.read_text())
          assert not data.get('preview'), 'A preview must never be published'
          assert len(data['frames']) >= 2, 'Forecast timeline is incomplete'
          data['imageBase'] = f"https://raw.githubusercontent.com/{os.environ['GITHUB_REPOSITORY']}/{os.environ['SNAPSHOT_SHA']}/plots/"
          path.write_text(json.dumps(data) + '\n')
          PY
          git add run.json
          git commit -qm 'Verified forecast timeline'
          # Keep only this snapshot's two commits on the data branch.
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data:data
